<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>工作室開放日程表</title>

  <!-- FullCalendar CSS -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet" />

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --primary-color: #3b82f6;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 12px 6px;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1040px;
      margin: 0 auto 12px auto;
      gap: 8px;
    }
    .header-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 { margin: 0; font-size: 18px; font-weight: 700; color: #0f172a; }

    .sync-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
      background-color: #fef08a;
      color: #854d0e;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .btn {
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .btn-admin { background-color: var(--primary-color); color: white; }
    .btn-add-event { background-color: #10b981; color: white; display: none; }
    .btn-logout { background-color: #ef4444; color: white; display: none; }
    .btn-save { background-color: #10b981; color: white; width: 100%; margin-top: 16px; padding: 12px; font-size: 15px; }
    .btn-cancel { background-color: #e2e8f0; color: #334155; width: 100%; margin-top: 8px; padding: 10px; font-size: 14px; }
    .btn-edit-action { background-color: var(--primary-color); color: white; width: 100%; padding: 12px; margin-bottom: 8px; font-size: 15px; }
    .btn-delete-action { background-color: #ef4444; color: white; width: 100%; padding: 12px; margin-bottom: 8px; font-size: 15px; }
    
    #calendar {
      max-width: 1040px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 6px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    /* 星期日與公眾假期整格變紅 */
    .fc-day-sun {
      background-color: #fff5f5 !important;
    }
    .fc-day-holiday {
      background-color: #fee2e2 !important;
    }

    /* 星期日表頭紅字 */
    .fc-col-header-cell.fc-day-sun {
      color: #dc2626 !important;
    }

    /* 假期名稱顯示在日期旁 */
    .holiday-label {
      font-size: 11px;
      color: #dc2626;
      font-weight: 700;
      margin-left: 6px;
    }

    .fc-daygrid-event-harness {
      margin-bottom: 2px !important;
    }

    .fc-event {
      border: none !important;
      border-radius: 6px !important;
      padding: 0 !important;
      cursor: pointer;
      overflow: hidden;
      background: transparent !important;
    }

    /* 活動背景顏色樣式 */
    .bg-daiben { background-color: #e0f2fe; color: #0369a1; }
    .bg-party { background-color: #ffedd5; color: #c2410c; }
    .bg-other { background-color: #f1f5f9; color: #334155; }
    .bg-closed { background-color: #fef2f2; color: #991b1b; }

    /* --- 💻 電腦版：填滿整個格子 --- */
    @media (min-width: 1025px) {
      .mobile-only { display: none !important; }
      .fc-daygrid-event-harness { width: 100% !important; }

      .event-card {
        display: flex;
        flex-direction: column;
        width: 100%;
        padding: 6px 8px;
        border-radius: 6px;
        box-sizing: border-box;
      }

      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 600;
        font-size: 11px;
      }

      .card-main {
        font-weight: 700;
        font-size: 12px;
        margin-top: 2px;
      }

      .card-footer {
        font-size: 10px;
        opacity: 0.8;
        margin-top: 1px;
      }
    }

    /* --- 📱 平板 & 手機版 --- */
    @media (max-width: 1024px) {
      .desktop-only { display: none !important; }
      body { padding: 8px 4px; }
      
      .header { flex-direction: column; align-items: flex-start; }
      .header-title-group { justify-content: space-between; width: 100%; }
      .btn-group { width: 100%; justify-content: flex-end; margin-top: 4px; }
      
      .fc .fc-toolbar { flex-direction: column; gap: 6px; }
      .fc .fc-toolbar-title { font-size: 15px !important; }
      .fc .fc-button { padding: 4px 6px !important; font-size: 11px !important; }

      .fc-theme-standard td, .fc-theme-standard th { padding: 0 !important; }

      .event-card {
        display: inline-flex;
        padding: 3px 6px;
        border-radius: 6px;
        width: auto;
        max-width: 100%;
      }

      .mobile-simple-card { display: flex; flex-direction: column; }

      .mobile-time {
        font-size: 9px;
        font-weight: 600;
        line-height: 1.1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .mobile-staff {
        font-size: 10px;
        font-weight: 700;
        line-height: 1.1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    }

    /* Modal 通用樣式 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 16px;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    .modal-content h3 { margin-top: 0; margin-bottom: 16px; font-size: 18px; font-weight: 700; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--text-sub); }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
      background-color: #f8fafc;
      outline: none;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary-color);
      background-color: #fff;
    }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }

    .detail-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 14px;
    }
    .detail-label { color: var(--text-sub); font-weight: 500; }
    .detail-val { font-weight: 600; color: var(--text-main); text-align: right; }

    @media (max-width: 768px) {
      .modal-overlay { align-items: flex-end; }
      .modal-content {
        width: 100%;
        max-width: 100%;
        border-radius: 20px 20px 0 0;
        padding: 24px 20px 32px 20px;
        animation: slideUp 0.25s ease-out;
      }
      @keyframes slideUp {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-title-group">
      <h1>工作室開放日程</h1>
      <span id="syncStatus" class="sync-badge">連線中...</span>
    </div>
    <div class="btn-group">
      <button id="addEventBtn" class="btn btn-add-event" onclick="openAddModalDirectly()">➕ 新增預約</button>
      <button id="adminBtn" class="btn btn-admin" onclick="toggleAdmin()">負責人登入</button>
      <button id="logoutBtn" class="btn btn-logout" onclick="logout()">登出</button>
    </div>
  </div>

  <div id="calendar"></div>

  <!-- 新增/修改預約 Modal -->
  <div id="eventModal" class="modal-overlay">
    <div class="modal-content">
      <h3 id="modalTitle">新增預約</h3>
      <div class="form-group">
        <label>預約日期</label>
        <input type="date" id="modalDate">
      </div>
      <div class="form-group">
        <label>活動類型</label>
        <select id="modalCategory" onchange="handleCategoryChange()">
          <option value="私人活動|#f59e0b">🟠 私人活動</option>
          <option value="工作|#3b82f6">🔵 工作</option>
          <option value="不開放|#ef4444">🔴 不開放（整天）</option>
        </select>
      </div>
      <div class="form-row" id="itemAndStaffRow">
        <div class="form-group">
          <label>活動項目</label>
          <select id="modalItem">
            <option value="帶本">📖 帶本</option>
            <option value="Party">🎉 Party</option>
            <option value="其他">📌 其他</option>
          </select>
        </div>
        <div class="form-group">
          <label>負責人員</label>
          <select id="modalStaff">
            <option value="Kensy">Kensy</option>
            <option value="Yuen">Yuen</option>
            <option value="其他">其他</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>備註說明（可留空）</label>
        <input type="text" id="modalCustomTitle" placeholder="例如：劇本名稱或備註">
      </div>
      <div class="form-row" id="timeRow">
        <div class="form-group">
          <label>開始時間</label>
          <input type="time" id="modalStartTime" value="10:00">
        </div>
        <div class="form-group">
          <label>結束時間</label>
          <input type="time" id="modalEndTime" value="18:00">
        </div>
      </div>
      <button class="btn btn-save" onclick="saveModalEvent()">確認儲存</button>
      <button class="btn btn-cancel" onclick="closeModal()">取消</button>
    </div>
  </div>

  <!-- 操作選擇 Modal -->
  <div id="actionModal" class="modal-overlay">
    <div class="modal-content">
      <h3>請選擇操作</h3>
      <p style="font-size: 13px; color: var(--text-sub); margin-top: -8px; margin-bottom: 20px;">選擇您要對此預約進行的操作：</p>
      <button class="btn btn-edit-action" onclick="onChooseEdit()">✏️ 修改此預約</button>
      <button class="btn btn-delete-action" onclick="onChooseDelete()">🗑️ 刪除此預約</button>
      <button class="btn btn-cancel" onclick="closeActionModal()">取消</button>
    </div>
  </div>

  <!-- 訪客查看詳情 Modal -->
  <div id="viewDetailModal" class="modal-overlay">
    <div class="modal-content">
      <h3>📅 預約詳情</h3>
      <div class="detail-item"><span class="detail-label">預約日期</span><span class="detail-val" id="viewDetailDate">-</span></div>
      <div class="detail-item"><span class="detail-label">預約時段</span><span class="detail-val" id="viewDetailTime">-</span></div>
      <div class="detail-item"><span class="detail-label">活動類型</span><span class="detail-val" id="viewDetailCategory">-</span></div>
      <div class="detail-item"><span class="detail-label">活動項目</span><span class="detail-val" id="viewDetailItem">-</span></div>
      <div class="detail-item"><span class="detail-label">負責人員</span><span class="detail-val" id="viewDetailStaff">-</span></div>
      <div class="detail-item" style="border-bottom: none;"><span class="detail-label">備註說明</span><span class="detail-val" id="viewDetailNote">-</span></div>
      <button class="btn btn-cancel" style="margin-top: 16px;" onclick="closeViewDetailModal()">關閉</button>
    </div>
  </div>

  <!-- FullCalendar JS -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAuuJDMEHBLPToulUTnqKyPSvmpB5RKjgQ",
      authDomain: "studiocalender-f52d4.firebaseapp.com",
      databaseURL: "https://studiocalender-f52d4-default-rtdb.firebaseio.com",
      projectId: "studiocalender-f52d4",
      storageBucket: "studiocalender-f52d4.firebasestorage.app",
      messagingSenderId: "187677978550",
      appId: "1:187677978550:web:57131e5e38f98c209b9b17"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const eventsRef = db.ref('studio_calendar_events');

   // 香港 2026 及 2027 年法定公眾假期與完整補假
    const hkHolidays = [
      // --- 2026 年 ---
      { start: "2026-01-01", title: "元旦" },
      { start: "2026-02-17", title: "農曆年初一" },
      { start: "2026-02-18", title: "農曆年初二" },
      { start: "2026-02-19", title: "農曆年初三" },
      { start: "2026-04-03", title: "耶穌受難節" },
      { start: "2026-04-04", title: "耶穌受難節翌日" },
      { start: "2026-04-05", title: "清明節" },
      { start: "2026-04-06", title: "復活節星期一" },
      { start: "2026-04-07", title: "清明節翌日增補假期" }, // 2026特有補假
      { start: "2026-05-01", title: "勞動節" },
      { start: "2026-05-24", title: "佛誕" },
      { start: "2026-05-25", title: "佛誕翌日補假" },       // 補星期日佛誕
      { start: "2026-06-19", title: "端午節" },
      { start: "2026-07-01", title: "特區成立紀念日" },
      { start: "2026-09-26", title: "中秋節翌日" },
      { start: "2026-10-01", title: "國慶日" },
      { start: "2026-10-18", title: "重陽節" },
      { start: "2026-10-19", title: "重陽節翌日補假" },     // 補星期日重陽節
      { start: "2026-12-25", title: "聖誕節" },
      { start: "2026-12-26", title: "聖誕節後第一個周日" },

      // --- 2027 年 ---
      { start: "2027-01-01", title: "元旦" },
      { start: "2027-02-06", title: "農曆年初一" },
      { start: "2027-02-08", title: "農曆年初三" },
      { start: "2027-02-09", title: "農曆年初四（年初二補假）" }, // 補星期日年初二
      { start: "2027-03-25", title: "耶穌受難節" },
      { start: "2027-03-26", title: "耶穌受難節翌日" },
      { start: "2027-03-29", title: "復活節星期一" },
      { start: "2027-04-05", title: "清明節" },
      { start: "2027-05-01", title: "勞動節" },
      { start: "2027-05-13", title: "佛誕" },
      { start: "2027-06-09", title: "端午節" },
      { start: "2027-07-01", title: "特區成立紀念日" },
      { start: "2027-09-16", title: "中秋節翌日" },
      { start: "2027-10-01", title: "國慶日" },
      { start: "2027-10-08", title: "重陽節" },
      { start: "2027-12-25", title: "聖誕節" },
      { start: "2027-12-27", title: "聖誕節後第一個周日" }
    ];
    
    let holidayMap = {};
    hkHolidays.forEach(h => {
      holidayMap[h.start] = h.title;
    });

    let isAdmin = false;
    let calendar;
    let editingEventId = null;
    let activeClickedEvent = null;

    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');

      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        height: 'auto',
        dayMaxEvents: false,

        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        
        buttonText: { today: '今天', month: '月', week: '週', day: '日' },
        displayEventEnd: false,
        eventTimeFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
        selectable: false,
        editable: false,

        // 使用 FullCalendar 內建的 classNames 機制來保證整格變紅
        dayCellClassNames: function(info) {
          const year = info.date.getFullYear();
          const month = String(info.date.getMonth() + 1).padStart(2, '0');
          const day = String(info.date.getDate()).padStart(2, '0');
          const dateStr = `${year}-${month}-${day}`;
          
          if (holidayMap[dateStr]) {
            return ['fc-day-holiday'];
          }
          return [];
        },

        // 在日曆格中渲染假期名稱標籤
        dayCellDidMount: function(info) {
          const year = info.date.getFullYear();
          const month = String(info.date.getMonth() + 1).padStart(2, '0');
          const day = String(info.date.getDate()).padStart(2, '0');
          const dateStr = `${year}-${month}-${day}`;
          
          if (holidayMap[dateStr]) {
            const dayNumberEl = info.el.querySelector('.fc-daygrid-day-number');
            if (dayNumberEl && !info.el.querySelector('.holiday-label')) {
              const span = document.createElement('span');
              span.className = 'holiday-label';
              span.innerHTML = `🇭🇰 ${holidayMap[dateStr]}`;
              dayNumberEl.appendChild(span);
            }
          }
        },

        eventContent: function(arg) {
          const props = arg.event.extendedProps || {};
          const catSplitted = (props.category || "工作|#3b82f6").split('|');
          const categoryName = catSplitted[0];
          
          const item = props.item || "其他";
          const staff = props.staff || "Kensy";
          const note = props.note || "";
          
          let timeOnly = arg.timeText.split('-')[0].trim();
          let bgClass = "bg-other";
          let itemIcon = "📖";
          if (item === "帶本") { bgClass = "bg-daiben"; itemIcon = "📖"; }
          if (item === "Party") { bgClass = "bg-party"; itemIcon = "🎉"; }

          if (categoryName === "不開放") {
            bgClass = "bg-closed";
            timeOnly = "全天";
          }

          let html = `
            <div class="event-card ${bgClass}">
              <div class="mobile-only mobile-simple-card">
                ${categoryName === "不開放" ? `
                  <div class="mobile-staff" style="color: #991b1b;">🚫不開放</div>
                ` : `
                  <div class="mobile-time">${timeOnly}</div>
                  <div class="mobile-staff">${staff}</div>
                `}
              </div>
              <div class="desktop-only card-top">
                <span>${arg.timeText}</span>
                ${categoryName !== "不開放" ? `<span>👤 ${staff}</span>` : ''}
              </div>
              <div class="desktop-only card-main">${itemIcon} ${categoryName === "不開放" ? "不開放" : item}</div>
              <div class="desktop-only card-footer">[${categoryName}]${note ? ` - ${note}` : ''}</div>
            </div>
          `;
          return { html: html };
        },

        dateClick: function(info) {
          if (!isAdmin) return;
          openAddModalDirectly(info.dateStr);
        },

        eventClick: function(info) {
          activeClickedEvent = info.event;
          if (isAdmin) {
            document.getElementById('actionModal').style.display = 'flex';
          } else {
            showViewDetailModal(info.event);
          }
        },

        eventDrop: handleEventChange,
        eventResize: handleEventChange
      });

      calendar.render();

      const syncStatus = document.getElementById('syncStatus');
      
      eventsRef.on('value', (snapshot) => {
        const cloudData = snapshot.val() || {};
        calendar.removeAllEvents();

        Object.keys(cloudData).forEach(key => {
          calendar.addEvent(cloudData[key]);
        });

        syncStatus.textContent = "🟢 雲端已同步";
        syncStatus.style.backgroundColor = "#dcfce7";
        syncStatus.style.color = "#15803d";
      }, (error) => {
        syncStatus.textContent = "🔴 連線失敗";
        syncStatus.style.backgroundColor = "#fee2e2";
        syncStatus.style.color = "#b91c1c";
      });
    });

    function showViewDetailModal(event) {
      const props = event.extendedProps || {};
      const catSplitted = (props.category || "工作|#3b82f6").split('|');
      const categoryName = catSplitted[0];

      const startDate = event.startStr.split('T')[0];
      const startTime = event.start ? event.start.toTimeString().substring(0, 5) : "";
      const endTime = event.end ? event.end.toTimeString().substring(0, 5) : "";

      document.getElementById('viewDetailDate').innerText = startDate;
      
      if (categoryName === "不開放") {
        document.getElementById('viewDetailTime').innerText = "全天不開放";
        document.getElementById('viewDetailCategory').innerText = "🔴 不開放";
        document.getElementById('viewDetailItem').innerText = "-";
        document.getElementById('viewDetailStaff').innerText = "-";
      } else {
        document.getElementById('viewDetailTime').innerText = `${startTime} ~ ${endTime}`;
        document.getElementById('viewDetailCategory').innerText = categoryName;
        document.getElementById('viewDetailItem').innerText = props.item || "其他";
        document.getElementById('viewDetailStaff').innerText = props.staff || "其他";
      }

      document.getElementById('viewDetailNote').innerText = props.note || "(無備註)";
      document.getElementById('viewDetailModal').style.display = 'flex';
    }

    function closeViewDetailModal() {
      document.getElementById('viewDetailModal').style.display = 'none';
    }

    function openAddModalDirectly(defaultDate = "") {
      editingEventId = null;
      document.getElementById('modalTitle').innerText = "新增預約";
      
      const todayStr = new Date().toISOString().split('T')[0];
      document.getElementById('modalDate').value = defaultDate || todayStr;

      document.getElementById('modalCategory').value = "工作|#3b82f6";
      document.getElementById('modalItem').value = "帶本";
      document.getElementById('modalStaff').value = "Kensy";
      document.getElementById('modalCustomTitle').value = "";
      document.getElementById('modalStartTime').value = "10:00";
      document.getElementById('modalEndTime').value = "18:00";
      
      handleCategoryChange();
      document.getElementById('eventModal').style.display = 'flex';
    }

    function saveModalEvent() {
      const selectedDate = document.getElementById('modalDate').value;
      if (!selectedDate) {
        alert("請選擇預約日期！");
        return;
      }

      const catValue = document.getElementById('modalCategory').value;
      const [categoryName, categoryColor] = catValue.split('|');
      const itemName = document.getElementById('modalItem').value;
      const staffName = document.getElementById('modalStaff').value;
      const customTitle = document.getElementById('modalCustomTitle').value.trim();
      
      let startTime = document.getElementById('modalStartTime').value;
      let endTime = document.getElementById('modalEndTime').value;

      if (categoryName === "不開放") {
        startTime = "00:00";
        endTime = "23:59";
      } else if (startTime >= endTime) {
        alert("結束時間必須晚於開始時間！");
        return;
      }

      const startISO = `${selectedDate}T${startTime}:00`;
      const endISO = `${selectedDate}T${endTime}:00`;

      if (isTimeOverlapping(startISO, endISO, editingEventId)) {
        alert("⚠️ 該時段已有其他活動重疊（Crush），請選擇其他時間！");
        return;
      }

      const eventId = editingEventId || String(Date.now());
      const newEventObj = {
        id: eventId,
        title: categoryName,
        start: startISO,
        end: endISO,
        color: categoryColor,
        extendedProps: {
          category: catValue,
          item: categoryName === "不開放" ? "不開放" : itemName,
          staff: categoryName === "不開放" ? "-" : staffName,
          note: customTitle
        }
      };

      eventsRef.child(eventId).set(newEventObj).then(() => {
        closeModal();
      });
    }

    function onChooseDelete() {
      if (!activeClickedEvent) return;
      closeActionModal();

      if (confirm(`確定要刪除這筆預約嗎？`)) {
        eventsRef.child(activeClickedEvent.id).remove();
      }
      activeClickedEvent = null;
    }

    function handleEventChange(changeInfo) {
      const newStart = changeInfo.event.startStr;
      const newEnd = changeInfo.event.endStr;

      if (isTimeOverlapping(newStart, newEnd, changeInfo.event.id)) {
        alert("⚠️ 時間與現有活動重疊（Crush），系統已還原該修改！");
        changeInfo.revert();
      } else {
        const ev = changeInfo.event;
        const updatedObj = {
          id: ev.id,
          title: ev.title,
          start: ev.startStr,
          end: ev.endStr,
          color: ev.backgroundColor,
          extendedProps: ev.extendedProps
        };
        eventsRef.child(ev.id).set(updatedObj);
      }
    }

    function isTimeOverlapping(newStart, newEnd, ignoreEventId = null) {
      const allEvents = calendar.getEvents();
      const newStartMs = new Date(newStart).getTime();
      const newEndMs = new Date(newEnd).getTime();

      for (let ev of allEvents) {
        if (ignoreEventId && ev.id === ignoreEventId) continue;
        const evStartMs = ev.start.getTime();
        const evEndMs = ev.end ? ev.end.getTime() : evStartMs;

        if (newStartMs < evEndMs && newEndMs > evStartMs) {
          return true;
        }
      }
      return false;
    }

    function onChooseEdit() {
      if (!activeClickedEvent) return;
      closeActionModal();

      editingEventId = activeClickedEvent.id;
      const selectedDate = activeClickedEvent.startStr.split('T')[0];
      
      document.getElementById('modalTitle').innerText = "修改預約";
      document.getElementById('modalDate').value = selectedDate;
      
      const props = activeClickedEvent.extendedProps || {};
      document.getElementById('modalCategory').value = props.category || "工作|#3b82f6";
      document.getElementById('modalItem').value = props.item || "帶本";
      document.getElementById('modalStaff').value = props.staff || "Kensy";
      document.getElementById('modalCustomTitle').value = props.note || "";

      if (activeClickedEvent.start) {
        document.getElementById('modalStartTime').value = activeClickedEvent.start.toTimeString().substring(0,5);
      }
      if (activeClickedEvent.end) {
        document.getElementById('modalEndTime').value = activeClickedEvent.end.toTimeString().substring(0,5);
      }

      handleCategoryChange();
      document.getElementById('eventModal').style.display = 'flex';
    }

    function closeActionModal() {
      document.getElementById('actionModal').style.display = 'none';
    }

    function handleCategoryChange() {
      const catValue = document.getElementById('modalCategory').value;
      const categoryName = catValue.split('|')[0];
      const timeRow = document.getElementById('timeRow');
      const itemAndStaffRow = document.getElementById('itemAndStaffRow');

      if (categoryName === "不開放") {
        timeRow.style.display = "none";
        itemAndStaffRow.style.display = "none";
      } else {
        timeRow.style.display = "flex";
        itemAndStaffRow.style.display = "flex";
      }
    }

    function closeModal() {
      document.getElementById('eventModal').style.display = 'none';
      document.getElementById('modalCustomTitle').value = '';
      editingEventId = null;
    }

    function toggleAdmin() {
      const password = prompt('請輸入負責人密碼：');
      if (password === '09101230') {
        isAdmin = true;
        document.getElementById('adminBtn').style.display = 'none';
        document.getElementById('logoutBtn').style.display = 'inline-block';
        document.getElementById('addEventBtn').style.display = 'inline-block';
        
        calendar.setOption('selectable', true);
        calendar.setOption('editable', true);
        alert('已登入負責人模式！');
      } else if (password !== null) {
        alert('密碼錯誤！');
      }
    }

    function logout() {
      isAdmin = false;
      document.getElementById('adminBtn').style.display = 'inline-block';
      document.getElementById('logoutBtn').style.display = 'none';
      document.getElementById('addEventBtn').style.display = 'none';
      
      calendar.setOption('selectable', false);
      calendar.setOption('editable', false);
      alert('已切換回訪客視角。');
    }
  </script>
</body>
</html>
