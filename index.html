<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作室日程表</title>
  
  <!-- TailWind CSS (樣式庫) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase 相容版 SDK (即時資料庫) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- 頂部導覽列 -->
  <header class="bg-white shadow-sm border-b border-gray-200 py-4 px-6 flex justify-between items-center">
    <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
      📅 工作室日程表
      <span id="syncStatus" class="text-xs font-normal bg-green-100 text-green-700 px-2 py-0.5 rounded-full">雲端已同步</span>
    </h1>
    <div>
      <button id="loginBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm transition">
        負責人登入
      </button>
      <button id="logoutBtn" class="hidden bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg text-sm transition">
        退出登入
      </button>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-4xl mx-auto p-4 sm:p-6">
    <!-- 管理員操作區 (預設隱藏) -->
    <div id="adminPanel" class="hidden bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-6">
      <h2 class="text-lg font-bold text-gray-800 mb-4">➕ 新增 / 編輯日程</h2>
      <form id="eventForm" class="space-y-4">
        <input type="hidden" id="eventId">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">預約日期</label>
          <input type="date" id="eventDate" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">日程內容與時間</label>
          <input type="text" id="eventTitle" placeholder="例如：14:00 - 16:00 王小姐拍攝" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div class="flex gap-2">
          <button type="submit" class="bg-blue-600 text-white px-5 py-2.5 rounded-lg text-sm hover:bg-blue-700 transition">儲存日程</button>
          <button type="button" id="cancelBtn" class="hidden bg-gray-200 text-gray-700 px-4 py-2.5 rounded-lg text-sm hover:bg-gray-300 transition">取消編輯</button>
        </div>
      </form>
    </div>

    <!-- 日程列表 display -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="p-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
        <h2 class="font-bold text-gray-700">最新工作室預約狀況</h2>
        <span class="text-xs text-gray-500">（即時連線更新中）</span>
      </div>
      <div id="eventList" class="divide-y divide-gray-100">
        <div class="p-6 text-center text-gray-400">資料載入中...</div>
      </div>
    </div>
  </main>

  <!-- JavaScript 邏輯 -->
  <script>
    // -------------------------------------------------------------
    // 1. Firebase 資料庫配置設定 (需替換為你的 Firebase 資訊)
    // -------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // 初始化 Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const eventsRef = db.ref('studio_events');

    // -------------------------------------------------------------
    // 2. 狀態管理 (權限與資料)
    // -------------------------------------------------------------
    let isAdmin = false;
    let eventsData = {};

    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const adminPanel = document.getElementById('adminPanel');
    const eventForm = document.getElementById('eventForm');
    const eventList = document.getElementById('eventList');
    const syncStatus = document.getElementById('syncStatus');

    // 管理員登入
    loginBtn.addEventListener('click', () => {
      const password = prompt('請輸入負責人管理密碼：');
      if (password === '09101230') {
        isAdmin = true;
        updateAdminUI();
        alert('登入成功！您可以新增與管理日程。');
      } else if (password !== null) {
        alert('密碼錯誤！');
      }
    });

    // 退出登入
    logoutBtn.addEventListener('click', () => {
      isAdmin = false;
      updateAdminUI();
    });

    function updateAdminUI() {
      if (isAdmin) {
        loginBtn.classList.add('hidden');
        logoutBtn.classList.remove('hidden');
        adminPanel.classList.remove('hidden');
      } else {
        loginBtn.classList.remove('hidden');
        logoutBtn.classList.add('hidden');
        adminPanel.classList.add('hidden');
      }
      renderEvents(eventsData);
    }

    // -------------------------------------------------------------
    // 3. 雲端即時同步 (Realtime Listening)
    // -------------------------------------------------------------
    // 當 Firebase 雲端資料有變動時（無論是誰在別台設備修改），這裡會自動觸發
    eventsRef.on('value', (snapshot) => {
      eventsData = snapshot.val() || {};
      syncStatus.textContent = '雲端已同步';
      syncStatus.className = 'text-xs font-normal bg-green-100 text-green-700 px-2 py-0.5 rounded-full';
      renderEvents(eventsData);
    }, (error) => {
      syncStatus.textContent = '連線失敗';
      syncStatus.className = 'text-xs font-normal bg-red-100 text-red-700 px-2 py-0.5 rounded-full';
      console.error(error);
    });

    // -------------------------------------------------------------
    // 4. 新增 / 編輯日程 (寫入 Firebase)
    // -------------------------------------------------------------
    eventForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!isAdmin) return;

      const id = document.getElementById('eventId').value || Date.now().toString();
      const date = document.getElementById('eventDate').value;
      const title = document.getElementById('eventTitle').value;

      // 寫入/更新 Firebase
      eventsRef.child(id).set({
        id: id,
        date: date,
        title: title,
        updatedAt: Date.now()
      }).then(() => {
        eventForm.reset();
        document.getElementById('eventId').value = '';
        document.getElementById('cancelBtn').classList.add('hidden');
      });
    });

    // 刪除日程
    window.deleteEvent = function(id) {
      if (!isAdmin) return;
      if (confirm('確定要刪除這筆預約嗎？')) {
        eventsRef.child(id).remove();
      }
    };

    // 編輯日程準備
    window.editEvent = function(id) {
      if (!isAdmin) return;
      const item = eventsData[id];
      if (item) {
        document.getElementById('eventId').value = item.id;
        document.getElementById('eventDate').value = item.date;
        document.getElementById('eventTitle').value = item.title;
        document.getElementById('cancelBtn').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    };

    document.getElementById('cancelBtn').addEventListener('click', () => {
      eventForm.reset();
      document.getElementById('eventId').value = '';
      document.getElementById('cancelBtn').classList.add('hidden');
    });

    // -------------------------------------------------------------
    // 5. 渲染日程列表到頁面上
    // -------------------------------------------------------------
    function renderEvents(data) {
      const keys = Object.keys(data);
      if (keys.length === 0) {
        eventList.innerHTML = `<div class="p-6 text-center text-gray-400">目前尚無預約日程</div>`;
        return;
      }

      // 依日期排序
      const sortedEvents = keys.map(k => data[k]).sort((a, b) => a.date.localeCompare(b.date));

      let html = '';
      sortedEvents.forEach(item => {
        html += `
          <div class="p-4 flex justify-between items-center hover:bg-gray-50 transition">
            <div class="flex flex-col sm:flex-row sm:items-center gap-2">
              <span class="font-bold text-blue-600 text-sm bg-blue-50 px-2.5 py-1 rounded-md w-fit">${item.date}</span>
              <span class="text-gray-800 text-sm font-medium">${item.title}</span>
            </div>
            ${isAdmin ? `
              <div class="flex gap-2">
                <button onclick="editEvent('${item.id}')" class="text-xs text-blue-600 hover:text-blue-800 font-medium">編輯</button>
                <button onclick="deleteEvent('${item.id}')" class="text-xs text-red-600 hover:text-red-800 font-medium">刪除</button>
              </div>
            ` : ''}
          </div>
        `;
      });

      eventList.innerHTML = html;
    }
  </script>
</body>
</html>
